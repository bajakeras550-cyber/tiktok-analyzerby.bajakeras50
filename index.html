
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AVEDOW AUDIO — TikTok Analyzer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #0b0b12;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 480px; margin: auto; }
    h1 { color: #00f0ff; }
    .card {
      background: #171722;
      border: 1px solid #303044;
      border-radius: 16px;
      padding: 18px;
      margin: 15px 0;
    }
    label { display: block; margin: 12px 0 6px; }
    input, button {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #414158;
      font-size: 16px;
    }
    input { background: #0c0c14; color: white; }
    button {
      background: #00e5ff;
      color: #080812;
      font-weight: bold;
      border: 0;
      margin-top: 16px;
      cursor: pointer;
    }
    .number { font-size: 28px; font-weight: bold; color: #00f0ff; }
    .muted { color: #aaa; font-size: 13px; }
    .error { color: #ff7777; }
  </style>
</head>
<body>
  <div class="container">
    <h1>AVEDOW AUDIO</h1>
    <p>TikTok Account Analyzer</p>

    <div class="card">
      <h3>Masukkan data akun</h3>
      <label>Username TikTok</label>
      <input id="username" placeholder="@username">

      <label>Followers asli</label>
      <input id="followers" type="number" min="0"
             step="1" placeholder="Contoh: 1000">

      <label>Total likes</label>
      <input id="likes" type="number" min="0"
             step="1" placeholder="Contoh: 15000">

      <label>Views video</label>
      <input id="views" type="number" min="0"
             step="1" placeholder="Contoh: 5000">

      <button onclick="analyze()">ANALISIS AKUN</button>
      <p class="muted">Mode manual — bukan data live dari TikTok.</p>
    </div>

    <div class="card" id="result" hidden>
      <h3 id="account"></h3>
      <p>Followers</p>
      <div class="number" id="fResult">0</div>
      <p>Total likes</p>
      <div class="number" id="lResult">0</div>
      <p>Views video</p>
      <div class="number" id="vResult">0</div>
      <p>Rasio likes terhadap views</p>
      <div class="number" id="engagement">0%</div>
      <p class="muted">Angka mengikuti input yang kamu masukkan.</p>
    </div>
  </div>

  <script>
    function analyze() {
      const username =
        document.getElementById("username").value.trim();
      const followersInput =
        document.getElementById("followers").value;
      const likesInput =
        document.getElementById("likes").value;
      const viewsInput =
        document.getElementById("views").value;

      if (
        !username ||
        followersInput === "" ||
        likesInput === "" ||
        viewsInput === ""
      ) {
        alert("Isi semua data dulu, bro!");
        return;
      }

      const followers = Number(followersInput);
      const likes = Number(likesInput);
      const views = Number(viewsInput);

      if (
        !Number.isSafeInteger(followers) || followers < 0 ||
        !Number.isSafeInteger(likes) || likes < 0 ||
        !Number.isSafeInteger(views) || views < 0
      ) {
        alert("Masukkan angka bulat yang valid.");
        return;
      }

      document.getElementById("account").textContent =
        username.startsWith("@") ? username : "@" + username;

      document.getElementById("fResult").textContent =
        followers.toLocaleString("id-ID");
      document.getElementById("lResult").textContent =
        likes.toLocaleString("id-ID");
      document.getElementById("vResult").textContent =
        views.toLocaleString("id-ID");

      const rate = views > 0 ? (likes / views) * 100 : 0;
      document.getElementById("engagement").textContent =
        rate.toFixed(2) + "%";

      document.getElementById("result").hidden = false;
    }
  </script>
</body>
</html>
